name: "Feature request"
description: "Suggest an idea for the project"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Describe the problem you're facing, not just a solution.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How could the app address this?
  - type: textarea
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    attributes:
      label: Provider-related?
      options:
        - label: "This is about a new/improved provider — could it be a plugin instead of a core change?"
          required: false
