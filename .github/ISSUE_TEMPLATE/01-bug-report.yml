name: "Bug report"
description: "Report a problem with the app"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** search can occasionally return no results — try searching again before reporting. Built-in providers scrape undocumented sites and can break at any time; if a provider fails, check whether a plugin or a newer commit already fixes it.
  - type: textarea
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Search for "..."
        3. Select provider / episode
        4. See error
    validations:
      required: true
  - type: input
    attributes:
      label: Device
      description: Android version and device model
    validations:
      required: true
  - type: input
    attributes:
      label: APK version
      description: Which release/version are you on (e.g. v1.0.0)?
  - type: textarea
    attributes:
      label: Logs / error output
      description: Paste any relevant terminal output or crash log.
      render: shell
